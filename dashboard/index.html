<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super 6 Research</title>
<link rel="stylesheet" href="style.css">
<script src="dashboard.js" defer></script>
</head>
<body>
<header><div><span class="brand">SUPER 6</span><span class="brand-label">Research</span></div><nav aria-label="Sections"><a href="#rounds">Rounds</a><a href="#performance">Performance</a></nav></header>
<main>
<section class="hero" aria-labelledby="title">
<p class="eyebrow">Football forecasting</p>
<h1 id="title">Super 6 Research</h1>
<p>Explore verified fixtures, score probabilities, and model results.</p>
</section>
<section class="panel" id="performance" aria-labelledby="performance-title">
<h2 id="performance-title">Model performance</h2>
<div class="metrics" id="metrics" aria-live="polite"></div>
<p id="evaluation-status"></p>
<div id="comparison" aria-live="polite"></div>
</section>
<section class="panel" id="rounds" aria-labelledby="rounds-title">
<div class="section-heading"><h2 id="rounds-title">Rounds</h2><label for="round">Round <select id="round" disabled></select></label></div>
<div id="round-content" aria-live="polite"><p>Loading round data…</p></div>
</section>
</main>
</body>
</html>
