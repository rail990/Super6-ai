name: Research system checks
on:
  pull_request:
  push:
    branches: ['develop/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m super6.report
      - run: node --check dashboard/dashboard.js
      - run: node --check dashboard/capture.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/dashboard.cjs
