name: Research system checks
on:
  pull_request:
  push:
    branches: ['develop/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify prospective records are append-only
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          if ! git diff --quiet --no-renames --diff-filter=DMRTUXB "$PREVIOUS_HEAD" "$GITHUB_SHA" -- data/prospective/; then
            echo "Existing prospective forecasts and settlements must remain byte-for-byte unchanged."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m super6.report
      - run: node --check dashboard/dashboard.js
      - run: node --check dashboard/capture.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: node tests/dashboard.cjs
